BASE: ['']
TOOLBOX_MODE: train_and_test
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 9e-3
  MODEL_FILE_NAME: UBFC-rPPG_DATASET2_DeepPhys
  PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/UBFC_DATASET/DATASET_2
    CACHED_PATH: /cache/UBFC-rPPG_DATASET2
    EXP_DATA_NAME: Initial_Run
    BEGIN: 0.0
    END: 0.7
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 180
      NUM_WORKERS: 4
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
VALID:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/UBFC_DATASET/DATASET_2
    CACHED_PATH: /cache/UBFC-rPPG_DATASET2
    EXP_DATA_NAME: Initial_Run
    BEGIN: 0.7
    END: 0.8
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 180
      NUM_WORKERS: 4
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/UBFC_DATASET/DATASET_2
    CACHED_PATH: /cache/UBFC-rPPG_DATASET2
    EXP_DATA_NAME: Initial_Run
    BEGIN: 0.8
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 180
      NUM_WORKERS: 4
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: /runs/UBFC-rPPG_DATASET2_DeepPhys
MODEL:
  DROP_RATE: 0.2
  NAME: DeepPhys
  MODEL_DIR: PreTrainedModels
