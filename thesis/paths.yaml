# Where the thesis datasets are, and where runs and caches go (tools/thesis_configs.py reads it).
# The batches run on different computers, so a folder can be missing here and right there: entries are never replaced
# because their folder is missing. After moving a drive, change the entry (or empty it for --find-paths to fill it).
# Fill the empty entries: python tools/thesis_configs.py --find-paths
# Write every config:     python tools/thesis_configs.py

cache:                                      # preprocessing caches (shared by the runs of a batch)
  batch1: D:/Datasets_Preprocessed
  batch2: C:/Datasets_Preprocessed
  batch3: C:/Datasets_Preprocessed
runs:                                       # LOG.PATH root: <runs>/<batch folder>/<run name>
  batch1: D:/Run/thesis
  batch2: C:/Run/thesis
  batch3: C:/Run/thesis

# Face crop input: the original videos.
video:
  UBFC-rPPG: D:/rPPG_Datasets/UBFC_dataset/DATASET_2
  PURE: D:/rPPG_Datasets/PURE
  COHFACE: D:/rPPG_Datasets/COHFACE
  lab: C:/Datasets                         # holds baseline/, JZC/ and RM/

# UV input: the vHRM Studio conversions (mirror mode).
uv:
  UBFC-rPPG: D:/rPPG_Datasets_uv/UBFC_dataset/DATASET_2
  PURE: D:/rPPG_Datasets_uv/PURE
  COHFACE: D:/rPPG_Datasets_uv/COHFACE
  lab:                                      # one folder per experiment (they need not share a parent)
    baseline: C:/Users/alexa/Datasets_vhrm/baseline
    JZC: C:/Users/alexa/Datasets_vhrm/JZC
    RM: C:/Users/alexa/Datasets_vhrm/RM

options:
  device: cuda:0
  wandb: true                               # Weights & Biases logging (WANDB.ENABLED)
