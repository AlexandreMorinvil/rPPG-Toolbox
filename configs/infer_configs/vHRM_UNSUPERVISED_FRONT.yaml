# Unsupervised baselines (POS, CHROM, ...) on the vHRM front view, scored against Zephyr HR.
BASE: ['']
TOOLBOX_MODE: "unsupervised_method"
TRAIN:
  DATA_LOADER_WORKERS: 2
UNSUPERVISED:
  METHOD: ["POS", "CHROM", "GREEN", "LGI", "PBV", "OMIT"]
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR']
  DATA:
    FS: 30
    DATASET: vHRM
    DO_PREPROCESS: True
    DATA_FORMAT: NDHWC
    DATA_PATH: "F:/Datasets preparation"
    CACHED_PATH: "C:/rPPG_cache"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    VHRM:
      EXPERIMENTS: ['JZC', 'baseline', 'HH']
      LABELS: []
      VIEWS: ['front']
      HR_SOURCE: zephyr
      REQUIRE_PPG: False
    PREPROCESS:
      DATA_TYPE: ['Raw']
      DATA_AUG: ['None']
      LABEL_TYPE: Raw
      DO_CHUNK: True
      CHUNK_LENGTH: 900                       # 30 s clips
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
LOG:
  PATH: runs/vHRM_unsupervised_front
INFERENCE:
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: True
    WINDOW_SIZE: 30
