# PhysNet trained and tested on the vHRM lab dataset, front camera, calm segments.
# Training target: synthetic PPG (from the Zephyr ECG). Evaluation: Zephyr HR.
# Participants: TEST = jzc15-jzc17, VALID = jzc13-jzc14, TRAIN = everyone else
# (baseline sessions are separate participant folders, so they are listed explicitly).
# For leave-one-participant-out, use tools/vhrm_cross_validation.py with this file.
BASE: ['']
TOOLBOX_MODE: "train_and_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 15
  LR: 9e-3
  MODEL_FILE_NAME: vHRM_vHRM_vHRM_physnet_front
  PLOT_LOSSES_AND_LR: True
  DATA_LOADER_WORKERS: 4
  DATA:
    FS: 30
    DATASET: vHRM
    DO_PREPROCESS: True                       # incremental: only new or changed videos are decoded
    DATA_FORMAT: NCDHW
    DATA_PATH: "F:/Datasets preparation"
    CACHED_PATH: "C:/rPPG_cache"             # ~50 GB for the front view at 72x72
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    VHRM:
      EXPERIMENTS: ['JZC', 'baseline']
      PARTICIPANTS: []                        # empty = all participants of the experiments
      EXCLUDE_PARTICIPANTS: ['jzc13', 'jzc13_baseline', 'jzc14', 'jzc14_baseline',
                             'jzc15', 'jzc15_baseline', 'jzc15_baseline_bl',
                             'jzc16', 'jzc16_baseline', 'jzc17', 'jzc17_baseline']
      LABELS: ['Resting', 'Recovery', 'Baseline_part1', 'Baseline_part2']
      VIEWS: ['front']
      CROP_MODE_BY_VIEW: ['front=face', 'back-left=face_or_full', 'back-right=face_or_full']
      PPG_SOURCE: synthetic                   # synthetic | rpeak_sine | rpeak_gaussian
      PPG_DELAY_SEC: 0.0                      # global sync correction (see tools/vhrm_sync_check.py)
      LAG_TABLE_PATH: ''                      # or the per-segment CSV written by vhrm_sync_check.py
      HR_SOURCE: zephyr
      REQUIRE_PPG: True
      VIDEO_DECODER: auto                     # NVDEC is used only without dynamic face detection
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      NUM_WORKERS: 2                          # each worker holds one decoded video in RAM
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'                        # small faces in full-body 4K frames: prefer YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
VALID:
  DATA:
    FS: 30
    DATASET: vHRM
    DO_PREPROCESS: True
    DATA_FORMAT: NCDHW
    DATA_PATH: "F:/Datasets preparation"
    CACHED_PATH: "C:/rPPG_cache"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    VHRM:
      EXPERIMENTS: ['JZC', 'baseline']
      PARTICIPANTS: ['jzc13', 'jzc13_baseline', 'jzc14', 'jzc14_baseline']
      LABELS: ['Resting', 'Recovery', 'Baseline_part1', 'Baseline_part2']
      VIEWS: ['front']
      PPG_SOURCE: synthetic
      HR_SOURCE: zephyr
      REQUIRE_PPG: True
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR']
  USE_LAST_EPOCH: False                       # pick the best epoch on VALID
  DATA:
    FS: 30
    DATASET: vHRM
    DO_PREPROCESS: True
    DATA_FORMAT: NCDHW
    DATA_PATH: "F:/Datasets preparation"
    CACHED_PATH: "C:/rPPG_cache"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    VHRM:
      EXPERIMENTS: ['JZC', 'baseline']
      PARTICIPANTS: ['jzc15', 'jzc15_baseline', 'jzc15_baseline_bl',
                     'jzc16', 'jzc16_baseline', 'jzc17', 'jzc17_baseline']
      LABELS: []                              # test on every activity, including Curl
      VIEWS: ['front']
      PPG_SOURCE: synthetic
      HR_SOURCE: zephyr
      REQUIRE_PPG: False                      # keep clips without PPG; they are scored on Zephyr HR
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/vHRM_physnet_front
MODEL:
  DROP_RATE: 0.2
  NAME: Physnet
  PHYSNET:
    FRAME_NUM: 128
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: True
    WINDOW_SIZE: 30                           # seconds; 30 s windows give ~2 bpm FFT resolution
  MODEL_PATH: ""
