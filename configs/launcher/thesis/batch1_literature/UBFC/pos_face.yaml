# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: unsupervised_method
DESCRIPTION: 'Batch 1 - POS on UBFC-rPPG, face crop, every subject (the test subjects are a subset: see thesis/splits.yaml).'
LOG:
  PATH: C:/Run/thesis/batch1_literature/b1_UBFC_pos_face
DEVICE: cuda:0
TRAIN:
  DATA_LOADER_WORKERS: 2
UNSUPERVISED:
  METHOD: [POS]
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR]
  DATA:
    DATASET: UBFC-rPPG
    DATA_PATH: D:/rPPG_Datasets/UBFC_dataset/DATASET_2
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NDHWC
    PREPROCESS:
      DATA_TYPE: [Raw]
      LABEL_TYPE: Raw
      DATA_AUG: [None]
      DO_CHUNK: false
      CHUNK_LENGTH: 180
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
VISUALIZE:
  HIGHLIGHTS: true
  HIGHLIGHT_WORST: 3
  VALID_BEST: true
  PROBE_EVERY_N_EPOCHS: 5
  PROBE_COUNT: 6
WANDB:
  ENABLED: true
  MODE: online
  PROJECT: rPPG-Toolbox
  ENTITY: ''
  RUN_NAME: b1_UBFC_pos_face
  GROUP: thesis-batch1
  JOB_TYPE: ''
  TAGS: [thesis, batch1, UBFC, pos, face]
  NOTES: 'Batch 1 - POS on UBFC-rPPG, face crop, every subject (the test subjects are a subset: see thesis/splits.yaml).'
  LOG_BATCH_LOSS: true
  LOG_FREQ: 50
