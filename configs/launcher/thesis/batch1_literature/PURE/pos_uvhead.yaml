# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: unsupervised_method
DESCRIPTION: 'Batch 1 - POS on PURE, UV map of the head only, every subject (the test subjects are a subset: see thesis/splits.yaml).'
LOG:
  PATH: C:/Run/thesis/batch1_literature/b1_PURE_pos_uvhead
DEVICE: cuda:0
TRAIN:
  DATA_LOADER_WORKERS: 2
UNSUPERVISED:
  METHOD: [POS]
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR]
  DATA:
    DATASET: PURE
    DATA_PATH: D:/rPPG_Datasets_uv/PURE
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NDHWC
    PREPROCESS:
      DATA_TYPE: [Raw]
      LABEL_TYPE: Raw
      DATA_AUG: [None]
      DO_CHUNK: false
      CHUNK_LENGTH: 180
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: [head]
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: none
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
VISUALIZE:
  HIGHLIGHTS: true
  HIGHLIGHT_WORST: 3
  VALID_BEST: true
  PROBE_EVERY_N_EPOCHS: 5
  PROBE_COUNT: 6
WANDB:
  ENABLED: true
  MODE: online
  PROJECT: rPPG-Toolbox
  ENTITY: ''
  RUN_NAME: b1_PURE_pos_uvhead
  GROUP: thesis-batch1
  JOB_TYPE: ''
  TAGS: [thesis, batch1, PURE, pos, uvhead]
  NOTES: 'Batch 1 - POS on PURE, UV map of the head only, every subject (the test subjects are a subset: see thesis/splits.yaml).'
  LOG_BATCH_LOSS: true
  LOG_FREQ: 50
