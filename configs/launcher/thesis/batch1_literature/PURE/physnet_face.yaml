# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 1 - Physnet on PURE, face crop.
  Trained on the 5 training subjects of thesis/splits.yaml, best epoch on the 1 validation subjects, tested on the 4 test subjects.
MODEL:
  NAME: Physnet
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: ''
  PHYSNET:
    FRAME_NUM: 128
LOG:
  PATH: D:/Run/thesis/batch1_literature/b1_PURE_physnet_face
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  EPOCHS: 20
  BATCH_SIZE: 4
  LR: 0.009
  EARLY_STOPPING:
    ENABLED: true
    PATIENCE: 4
    TOLERANCE: 0.0
  MODEL_FILE_NAME: b1_PURE_physnet_face
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: PURE
    DATA_PATH: D:/rPPG_Datasets/PURE
    CACHED_PATH: D:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    SUBJECTS: ['01', '02', '03', '04', '05']
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
VALID:
  DATA:
    DATASET: PURE
    DATA_PATH: D:/rPPG_Datasets/PURE
    CACHED_PATH: D:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    SUBJECTS: ['06']
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
TEST:
  DATA:
    DATASET: PURE
    DATA_PATH: D:/rPPG_Datasets/PURE
    CACHED_PATH: D:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    SUBJECTS: ['07', 08, 09, '10']
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
