BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 1 - RhythmFormer on PURE, UV map of the head only.
  Trained on the 5 training subjects of thesis/splits.yaml, best epoch on the 1 validation subjects, tested on the 4 test subjects.
MODEL:
  NAME: RhythmFormer
  DROP_RATE: 0.2
  RESUME: ''
