      CHUNK_LENGTH: 160
      RESIZE:
        W: 128
        H: 128
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: [head]
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
