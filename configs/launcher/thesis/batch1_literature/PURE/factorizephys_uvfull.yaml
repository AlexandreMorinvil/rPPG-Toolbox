    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
