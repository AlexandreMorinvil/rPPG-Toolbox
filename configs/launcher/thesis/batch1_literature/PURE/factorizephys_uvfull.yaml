    CHANNELS: 3
    FRAME_NUM: 160
    TYPE: Standard
    MD_FSAM: true
    MD_TYPE: NMF
    MD_TRANSFORM: T_KAB
    MD_R: 1
    MD_S: 1
    MD_STEPS: 4
    MD_RESIDUAL: true
