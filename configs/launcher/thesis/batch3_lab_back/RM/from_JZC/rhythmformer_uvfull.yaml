# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: only_test
DESCRIPTION: |-
  Batch 3 - RhythmFormer on RM, UV map of the whole body: the batch 3 model of JZC, fine-tuned on its back-left + back-right videos, tested as it is.
  No training on RM: tested on its 6 test people, on the three views (by_view.csv). First 120 s of each recording. Squat segments only.
MODEL:
  NAME: RhythmFormer
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: ''
LOG:
  PATH: C:/Run/thesis/batch3_lab_back/b3_rm_from_jzc_rhythmformer_uvfull
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  DATA_LOADER_WORKERS: 4
TEST:
  DATA:
    DATASET: vHRM
    DATA_PATH: C:/Users/alexa/Datasets_vhrm
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NDCHW
    PREPROCESS:
      DATA_TYPE: [Standardized]
      LABEL_TYPE: Standardized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      RESIZE:
        W: 128
        H: 128
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [RM]
      EXPERIMENT_PATHS: ['RM=C:/Users/alexa/Datasets_vhrm/RM']
      PARTICIPANTS: [RM06, RM12, RM15, RM16, RM17, RM20]
      EXCLUDE_PARTICIPANTS: []
      LABELS: [Squat]
      EXCLUDE_LABELS: []
      VIEWS: [front, back-left, back-right]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.0
      FACE_SEARCH_WIDTH: 1.0
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: false
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
      PREDICTION_IS_DIFF: false
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR, MACC, BA]
  USE_LAST_EPOCH: false
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
  MODEL_PATH: <run batch3_lab_back/JZC/finetune/rhythmformer_uvfull.yaml, then tools/thesis_configs.py>
VISUALIZE:
  HIGHLIGHTS: true
  HIGHLIGHT_WORST: 3
  VALID_BEST: true
  PROBE_EVERY_N_EPOCHS: 5
  PROBE_COUNT: 6
WANDB:
  ENABLED: true
  MODE: online
  PROJECT: rPPG-Toolbox
  ENTITY: ''
  RUN_NAME: b3_rm_from_jzc_rhythmformer_uvfull
  GROUP: thesis-batch3
  JOB_TYPE: ''
  TAGS: [thesis, batch3, RM, back, from_JZC, rhythmformer, uvfull]
  NOTES: 'Batch 3 - RhythmFormer on RM, UV map of the whole body: the batch 3 model of JZC, fine-tuned on its back-left +
    back-right videos, tested as it is.'
  LOG_BATCH_LOSS: true
  LOG_FREQ: 50
REPORT:
  ENABLED: true
  LABELS: []
  PARTICIPANTS: [RM06, RM12, RM15, RM16, RM17, RM20]
  EXPORT_CSV: true
