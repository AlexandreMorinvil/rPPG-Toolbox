# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 3 - FactorizePhys on JZC, UV map of the whole body: the batch 2 front-camera model of JZC fine-tuned on the back-left + back-right videos of the training people, best epoch on the validation people, tested on the three views of the test people (by_view.csv).
  10 epochs at 0.1 x the learning rate.
MODEL:
  NAME: FactorizePhys
  DROP_RATE: 0.1
  RESUME: ''
  INIT_WEIGHTS: <run batch2_lab_front/JZC/factorizephys_uvfull.yaml, then tools/thesis_configs.py>
  FactorizePhys:
    CHANNELS: 3
    FRAME_NUM: 160
    TYPE: Standard
    MD_FSAM: true
    MD_TYPE: NMF
    MD_TRANSFORM: T_KAB
    MD_R: 1
    MD_S: 1
    MD_STEPS: 4
    MD_RESIDUAL: true
    MD_INFERENCE: true
LOG:
  PATH: C:/Run/thesis/batch3_lab_back/b3_jzc_ft_factorizephys_uvfull
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  EPOCHS: 10
  BATCH_SIZE: 4
  LR: 0.0001
  EARLY_STOPPING:
    ENABLED: true
    PATIENCE: 7
    TOLERANCE: 0.0
  MODEL_FILE_NAME: b3_jzc_ft_factorizephys_uvfull
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: vHRM
    DATA_PATH: C:/Users/alexa/Datasets_vhrm
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [Raw]
      LABEL_TYPE: Standardized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [JZC]
      EXPERIMENT_PATHS: ['JZC=C:/Users/alexa/Datasets_vhrm/JZC']
      PARTICIPANTS: [jzc01, jzc03, jzc04, jzc05, jzc06, jzc08, jzc09, jzc15]
      EXCLUDE_PARTICIPANTS: []
      LABELS: []
      EXCLUDE_LABELS: []
      VIEWS: [back-left, back-right]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.0
      FACE_SEARCH_WIDTH: 1.0
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
