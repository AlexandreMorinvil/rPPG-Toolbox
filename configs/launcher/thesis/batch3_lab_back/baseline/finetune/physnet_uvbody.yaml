# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 3 - Physnet on baseline, UV map of every body part except the head: the batch 2 front-camera model of baseline fine-tuned on the back-left + back-right videos of the training people, best epoch on the validation people, tested on the three views of the test people (by_view.csv).
  10 epochs at 0.1 x the learning rate.
MODEL:
  NAME: Physnet
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: <run batch2_lab_front/baseline/physnet_uvbody.yaml, then tools/thesis_configs.py>
  PHYSNET:
    FRAME_NUM: 128
LOG:
  PATH: C:/Run/thesis/batch3_lab_back/b3_baseline_ft_physnet_uvbody
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  EPOCHS: 10
  BATCH_SIZE: 4
  LR: 0.0009
  EARLY_STOPPING:
    ENABLED: true
    PATIENCE: 7
    TOLERANCE: 0.0
  MODEL_FILE_NAME: b3_baseline_ft_physnet_uvbody
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets_vhrm/laboratory
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: [head]
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [baseline]
      EXPERIMENT_PATHS: ['baseline=F:/Datasets_vhrm/laboratory/baseline']
      PARTICIPANTS: [H04_baseline_after, H04_baseline_before, PO01_baseline, PO05_baseline, PO07_baseline, RM010_baseline_after,
        RM010_baseline_before, RM01_baseline_after, RM01_baseline_before, RM04_baseline_after, RM04_baseline_before, RM07_baseline_after,
        RM07_baseline_before, RM08_baseline_after, RM08_baseline_before, RM18_baseline_after, RM18_baseline_before, RM19_baseline_after,
        RM19_baseline_before, RM22_baseline_after, RM22_baseline_before, RM23_baseline_after, RM23_baseline_before, RM24_baseline_after,
        jzc01_baseline, jzc03_baseline, jzc04_baseline, jzc05_baseline, jzc06_baseline, jzc08_baseline, jzc09_baseline, jzc15_baseline]
      EXCLUDE_PARTICIPANTS: []
      LABELS: []
      EXCLUDE_LABELS: []
      VIEWS: [back-left, back-right]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.0
      FACE_SEARCH_WIDTH: 1.0
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
