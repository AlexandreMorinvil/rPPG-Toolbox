# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 2 - Physnet on RM, front camera, UV map of every body part except the head.
  Trained on the 10 training people of thesis/splits.yaml, best epoch on the 2 validation people, tested on the 6 test people. First 120 s of each recording. Squat segments only.
MODEL:
  NAME: Physnet
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: ''
  PHYSNET:
    FRAME_NUM: 128
LOG:
  PATH: C:/Run/thesis/batch2_lab_front/b2_rm_physnet_uvbody
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  EPOCHS: 20
  BATCH_SIZE: 4
  LR: 0.009
  EARLY_STOPPING:
    ENABLED: true
    PATIENCE: 4
    TOLERANCE: 0.0
  MODEL_FILE_NAME: b2_rm_physnet_uvbody
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets_vhrm/laboratory
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: [head]
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [RM]
      EXPERIMENT_PATHS: ['RM=F:/Datasets_vhrm/laboratory/RM']
      PARTICIPANTS: [RM01, RM04, RM07, RM08, RM10, RM18, RM19, RM22, RM23, RM24]
      EXCLUDE_PARTICIPANTS: []
      LABELS: [Squat]
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.0
      FACE_SEARCH_WIDTH: 1.0
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
