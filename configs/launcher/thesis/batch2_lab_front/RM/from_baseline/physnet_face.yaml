# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: only_test
DESCRIPTION: |-
  Batch 2 - Physnet on RM, face crop: the batch 2 front-camera model of baseline, tested as it is.
  No training on RM: tested on its 6 test people, on the front camera. First 120 s of each recording. Squat segments only.
MODEL:
  NAME: Physnet
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: ''
  PHYSNET:
    FRAME_NUM: 128
LOG:
  PATH: C:/Run/thesis/batch2_lab_front/b2_rm_from_baseline_physnet_face
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  DATA_LOADER_WORKERS: 4
TEST:
  DATA:
    DATASET: vHRM
    DATA_PATH: C:/Datasets
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
    VHRM:
      EXPERIMENTS: [RM]
      EXPERIMENT_PATHS: []
      PARTICIPANTS: [RM06, RM12, RM15, RM16, RM17, RM20]
      EXCLUDE_PARTICIPANTS: []
      LABELS: [Squat]
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.5
      FACE_SEARCH_WIDTH: 0.7
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: false
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
      PREDICTION_IS_DIFF: true
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR, MACC, BA]
  USE_LAST_EPOCH: false
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
  MODEL_PATH: C:/Run/thesis/batch2_lab_front/b2_baseline_physnet_face/vHRM_72x72_C128_DiffNormalized_FS30_ff008af7/PreTrainedModels/b2_baseline_physnet_face_Epoch10.pth
