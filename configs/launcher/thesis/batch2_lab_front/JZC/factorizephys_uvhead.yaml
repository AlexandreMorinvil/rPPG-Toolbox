# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: train_and_test
DESCRIPTION: |-
  Batch 2 - FactorizePhys on JZC, front camera, UV map of the head only.
  Trained on the 8 training people of thesis/splits.yaml, best epoch on the 3 validation people, tested on the 6 test people. First 120 s of each recording.
MODEL:
  NAME: FactorizePhys
  DROP_RATE: 0.1
  RESUME: ''
  INIT_WEIGHTS: ''
  FactorizePhys:
    CHANNELS: 3
    FRAME_NUM: 160
    TYPE: Standard
    MD_FSAM: true
    MD_TYPE: NMF
    MD_TRANSFORM: T_KAB
    MD_R: 1
    MD_S: 1
    MD_STEPS: 4
    MD_RESIDUAL: true
    MD_INFERENCE: true
LOG:
  PATH: C:/Run/thesis/batch2_lab_front/b2_jzc_factorizephys_uvhead
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
TRAIN:
  EPOCHS: 20
  BATCH_SIZE: 4
  LR: 0.001
  EARLY_STOPPING:
    ENABLED: true
    PATIENCE: 4
    TOLERANCE: 0.0
  MODEL_FILE_NAME: b2_jzc_factorizephys_uvhead
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets_vhrm/laboratory
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [Raw]
      LABEL_TYPE: Standardized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: [head]
      EXCLUDE_CHARTS: []
      MIN_COVERAGE: 0.25
      FILL: temporal_mean
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [JZC]
      EXPERIMENT_PATHS: ['JZC=<not set: uv.lab.JZC in thesis/paths.yaml>']
      PARTICIPANTS: [jzc01, jzc03, jzc04, jzc05, jzc06, jzc08, jzc09, jzc15]
