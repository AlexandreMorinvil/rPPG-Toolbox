# Generated by tools/thesis_configs.py from thesis/paths.yaml and thesis/splits.yaml: edit those and re-run.
BASE: ['']
TOOLBOX_MODE: unsupervised_method
DESCRIPTION: Batch 2 - POS on baseline, front camera, UV map of every body part except the head, every participant. First
  120 s of each recording.
LOG:
  PATH: C:/Run/thesis/batch2_lab_front/b2_baseline_pos_uvbody
DEVICE: cuda:0
TRAIN:
  DATA_LOADER_WORKERS: 2
UNSUPERVISED:
  METHOD: [POS]
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR]
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets_vhrm/laboratory
    CACHED_PATH: C:/Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NDHWC
    PREPROCESS:
      DATA_TYPE: [Raw]
      LABEL_TYPE: Raw
      DATA_AUG: [None]
      DO_CHUNK: false
      CHUNK_LENGTH: 180
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: false
    UV:
      ENABLED: true
      LAYOUT: packed
      CHARTS: []
      EXCLUDE_CHARTS: [head]
      MIN_COVERAGE: 0.25
      FILL: none
      MIN_PIXEL_VALID_FRACTION: 0.0
      RESAMPLE_TO_FS: false
    VHRM:
      EXPERIMENTS: [baseline]
      EXPERIMENT_PATHS: ['baseline=F:/Datasets_vhrm/laboratory/baseline']
      PARTICIPANTS: []
      EXCLUDE_PARTICIPANTS: []
      LABELS: []
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=person_face, back-right=person_face]
      MIN_FACE_FRACTION: 0.0
      FACE_SEARCH_WIDTH: 1.0
      MAX_DURATION_SEC: 120.0
      MAX_DURATION_SEC_BY_LABEL: []
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: false
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
VISUALIZE:
  HIGHLIGHTS: true
  HIGHLIGHT_WORST: 3
  VALID_BEST: true
  PROBE_EVERY_N_EPOCHS: 5
  PROBE_COUNT: 6
WANDB:
  ENABLED: true
  MODE: online
  PROJECT: rPPG-Toolbox
  ENTITY: ''
