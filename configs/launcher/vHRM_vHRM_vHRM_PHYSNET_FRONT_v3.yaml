BASE: ['']
TOOLBOX_MODE: train_and_test
MODEL:
  NAME: Physnet
  DROP_RATE: 0.2
  RESUME: ''
  INIT_WEIGHTS: ''
  PHYSNET:
    FRAME_NUM: 128
LOG:
  PATH: C:\Run\vHRM_physnet_front_no2
DEVICE: cuda:0
TRAIN:
  EPOCHS: 20
  EARLY_STOPPING:
    ENABLED: false
    PATIENCE: 6
    TOLERANCE: 0.0
  BATCH_SIZE: 4
  LR: 0.009
  MODEL_FILE_NAME: vHRM_vHRM_vHRM_physnet_front
  PLOT_LOSSES_AND_LR: true
  DATA_LOADER_WORKERS: 4
  SAVE_RESUME: true
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets preparation
    CACHED_PATH: C:\Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
    VHRM:
      EXPERIMENTS: [JZC, baseline]
      PARTICIPANTS: []
      EXCLUDE_PARTICIPANTS: [jzc13, jzc13_baseline, jzc14, jzc14_baseline, jzc15, jzc15_baseline, jzc15_baseline_bl, jzc16,
        jzc16_baseline, jzc17, jzc17_baseline]
      LABELS: [Resting, Recovery, Baseline_part1, Baseline_part2]
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=face_or_full, back-right=face_or_full]
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
VALID:
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets preparation
    CACHED_PATH: C:\Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
    VHRM:
      EXPERIMENTS: [JZC, baseline]
      PARTICIPANTS: [jzc13, jzc13_baseline, jzc14, jzc14_baseline]
      EXCLUDE_PARTICIPANTS: []
      LABELS: [Resting, Recovery, Baseline_part1, Baseline_part2]
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=face_or_full, back-right=face_or_full]
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
TEST:
  DATA:
    DATASET: vHRM
    DATA_PATH: F:/Datasets preparation
    CACHED_PATH: C:\Datasets_Preprocessed
    DO_PREPROCESS: true
    FS: 30
    BEGIN: 0.0
    END: 1.0
    DATA_FORMAT: NCDHW
    PREPROCESS:
      DATA_TYPE: [DiffNormalized]
      LABEL_TYPE: DiffNormalized
      DATA_AUG: [None]
      DO_CHUNK: true
      CHUNK_LENGTH: 128
      RESIZE:
        W: 72
        H: 72
      NUM_WORKERS: 2
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
    VHRM:
      EXPERIMENTS: [JZC, baseline]
      PARTICIPANTS: [jzc15, jzc15_baseline, jzc15_baseline_bl, jzc16, jzc16_baseline, jzc17, jzc17_baseline]
      EXCLUDE_PARTICIPANTS: []
      LABELS: []
      EXCLUDE_LABELS: []
      VIEWS: [front]
      CROP_MODE_BY_VIEW: [front=face, back-left=face_or_full, back-right=face_or_full]
      PPG_SOURCE: synthetic
      PPG_DELAY_SEC: 0.0
      LAG_TABLE_PATH: ''
      HR_SOURCE: zephyr
      REQUIRE_PPG: false
      PREDICTION_IS_DIFF: true
      VIDEO_DECODER: auto
      INCREMENTAL_PREPROCESS: true
      CACHE_DTYPE: float16
      SHOW_VIDEO_PROGRESS: true
  METRICS: [MAE, RMSE, MAPE, Pearson, SNR, MACC, BA, AU_METRICS]
  USE_LAST_EPOCH: false
INFERENCE:
  BATCH_SIZE: 4
  DATA_LOADER_WORKERS: 0
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: true
    WINDOW_SIZE: 30
WANDB:
  ENABLED: true
  MODE: online
  PROJECT: rPPG-Toolbox
  ENTITY: ''
  RUN_NAME: ''
  GROUP: ''
  JOB_TYPE: ''
  TAGS: []
  NOTES: ''
  LOG_BATCH_LOSS: true
  LOG_FREQ: 50
